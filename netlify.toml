# ─── Moriya Nails – Netlify configuration ───────────────────────────
# Publishes the static site from the project root and runs the booking
# backend as serverless functions under /api/*.

[build]
  publish = "."
  functions = "netlify/functions"

# Map the frontend's /api/* calls to the serverless functions
[[redirects]]
  from = "/api/busy-slots"
  to = "/.netlify/functions/busy-slots"
  status = 200

[[redirects]]
  from = "/api/book"
  to = "/.netlify/functions/book"
  status = 200

[[redirects]]
  from = "/api/manage-booking"
  to = "/.netlify/functions/manage-booking"
  status = 200

[[redirects]]
  from = "/api/delete-client"
  to = "/.netlify/functions/delete-client"
  status = 200

[[redirects]]
  from = "/api/waitlist-notify"
  to = "/.netlify/functions/waitlist-notify"
  status = 200

# ─── Home-screen manifest ───────────────────────────────────────────
# Spelled out so the manifest can't go out as a plain download — a browser
# ignores one that doesn't arrive as JSON, and the home-screen icon goes with it.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# ─── Keep-alive: ping Supabase daily so the free-tier project never pauses ───
# (a paused project stops resolving and breaks login). Runs at 06:00 UTC daily.
[functions."keepalive"]
  schedule = "0 6 * * *"

# ─── Reminder nudge: email Moriya a few days before any day with appointments ───
# so she remembers to send each client her WhatsApp reminder from the dashboard.
# Runs 07:00 UTC daily (~10:00 Israel); only emails when that day has bookings.
[functions."reminder-nudge"]
  schedule = "0 7 * * *"

# ─── Weekly database backup: email Moriya a full JSON export of every table ───
# (Supabase free tier has no automatic backups). Runs Saturday 18:00 UTC, which
# is ~21:00 Israel time (IDT) — close to the end of Shabbat. Like reminder-nudge,
# this drifts an hour under winter clock (IST) since the schedule is UTC-fixed.
[functions."backup"]
  schedule = "0 18 * * 6"
